; Kids Games for the Elecrow CrowPanel 7.0 (basic, NOT the ADVANCE 7.0)
; ESP32-S3-WROOM-1-N4R8: 4 MB quad flash, 8 MB octal PSRAM, 800x480 RGB, GT911 touch
;
; Windows tip: if the build fails with "filename or extension is too long",
; move the project to a short path (e.g. C:\dev\crowpanel7-kids-games) or set
; PLATFORMIO_BUILD_DIR / PLATFORMIO_LIBDEPS_DIR to short folders.

[env:crowpanel7-basic]
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    lovyan03/LovyanGFX@1.1.16
